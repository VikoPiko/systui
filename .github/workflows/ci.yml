name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      # Tests that need Docker, WSL, an NVIDIA GPU or an SSH server skip themselves (or accept
      # "unavailable") when those are missing, so this is safe on hosted runners.
      - name: Tests
        run: cargo test --locked --no-fail-fast

      - name: Terminal smoke test (real TUI in a pseudo-terminal)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          python3 scripts/pty_smoke.py

  msrv:
    name: minimum supported Rust (see rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
