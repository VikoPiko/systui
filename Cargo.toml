[package]
name = "systui"
version = "0.1.0"
edition = "2021"
# Real minimum: `sysinfo` 0.40 needs rustc 1.95 (verified: 1.95 builds and passes, 1.94 is rejected).
rust-version = "1.95"
description = "Fast, keyboard-first terminal system monitor"
license = "MIT"
readme = "README.md"
keywords = ["system-monitor", "tui", "terminal", "processes"]
categories = ["command-line-utilities"]
# Set a repository URL and remove this line when you decide where it is published.
publish = false

[[bin]]
name = "systui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }
clap = { version = "4", features = ["derive"] }
# Shell completions and the man page are generated from the same CLI definition as --help.
clap_complete = "4"
clap_mangen = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
thiserror = "2"
nvml-wrapper = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[target.'cfg(windows)'.dependencies]
# Same major version sysinfo already uses, so nothing extra is compiled except this feature.
windows = { version = "0.62", features = ["Win32_System_Power"] }

[target.'cfg(unix)'.dependencies]
# Only for killpg: a timed-out child's whole process group is killed, not just the shell.
libc = "0.2"

# `.deb` via cargo-deb; use scripts/build-deb.sh (it generates the man page and completions first).
[package.metadata.deb]
maintainer = "The systui maintainers <noreply@example.com>"  # replace with a real contact before publishing
copyright = "2026, The systui authors"
license-file = ["LICENSE", "0"]
extended-description = """\
systui is a native terminal system monitor: live CPU, memory, storage and network, a process \
explorer with guarded termination, and optional Docker, WSL, GPU, health-check, alert and \
read-only SSH panels. It is read-only by default, never elevates and has no telemetry."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/systui", "usr/bin/", "755"],
    ["target/pkg/systui.1.gz", "usr/share/man/man1/", "644"],
    ["target/pkg/systui.bash", "usr/share/bash-completion/completions/systui", "644"],
    ["target/pkg/_systui", "usr/share/zsh/vendor-completions/_systui", "644"],
    ["target/pkg/systui.fish", "usr/share/fish/vendor_completions.d/systui.fish", "644"],
    ["README.md", "usr/share/doc/systui/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/systui/CHANGELOG.md", "644"],
    ["config/config.example.toml", "usr/share/doc/systui/examples/config.example.toml", "644"],
]
